<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sign In | NOVA MART{% endblock %}</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0f172a",
            "secondary": "#4f46e5",
            "secondary-hover": "#4338ca",
            "accent": "#06b6d4",
            "background": "#f8fafc",
            "surface": "#ffffff",
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
          }
        }
      }
    };
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
  <div class="flex-1 flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="mb-8 text-center">
      <a href="{{ url_for('customer.home') }}" class="inline-flex items-center gap-2.5 group">
        <div class="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg group-hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-2xl text-cyan-300">shopping_bag</span>
        </div>
        <div class="text-2xl font-extrabold tracking-tight text-slate-900">
          NOVA<span class="text-indigo-600 ml-1">MART</span>
        </div>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-200/80">
      {% block content %}{% endblock %}
    </div>

    <div class="mt-8 text-center text-xs text-slate-400">
      &copy; 2026 NOVA MART Technologies India. Phase 1 Demo.
    </div>
  </div>

  <!-- Toast Notification System -->
  {% include 'components/toasts.html' %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
