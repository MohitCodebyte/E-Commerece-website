{% extends 'base_seller.html' %}

{% block title %}Stock Adjustment | VendorCenter{% endblock %}
{% block page_title %}Adjust Inventory{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">Stock Adjustment</h2>
      <p class="text-xs text-slate-500 mt-0.5">Audit inventory levels for supplier restock or damaged items</p>
    </div>
    <a href="{{ url_for('seller.inventory') }}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors">
      Cancel
    </a>
  </div>

  <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
    <form action="{{ url_for('seller.stock_adjust') }}" method="POST" class="space-y-4 text-xs font-semibold">
      <div>
        <label class="block text-slate-700 uppercase mb-1">Select Product</label>
        <select name="product_id" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold">
          {% for p in products %}
            <option value="{{ p.id }}" {% if selected_product and selected_product.id == p.id %}selected{% endif %}>
              {{ p.title }} (Current: {{ p.stock }} units &bull; {{ p.sku }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-slate-700 uppercase mb-1">New Total Stock Level</label>
        <input type="number" name="new_stock" min="0" required 
               value="{{ selected_product.stock if selected_product else 50 }}"
               class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm">
      </div>

      <div>
        <label class="block text-slate-700 uppercase mb-1">Reason for Adjustment</label>
        <select name="reason" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold">
          <option value="New stock arrival from supplier">New stock arrival from supplier</option>
          <option value="Physical warehouse stock audit count">Physical warehouse stock audit count</option>
          <option value="Damaged or defective inventory write-off">Damaged or defective inventory write-off</option>
          <option value="Customer return restocked">Customer return restocked</option>
        </select>
      </div>

      <div class="pt-4 flex justify-end gap-3">
        <a href="{{ url_for('seller.inventory') }}" class="px-5 py-2.5 bg-slate-100 rounded-xl font-bold text-slate-700">Cancel</a>
        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition-all">
          Save Adjustment
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
