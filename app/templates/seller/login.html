{% extends 'base_auth.html' %}

{% block title %}Seller Sign In | VendorCenter{% endblock %}

{% block content %}
<div class="mb-6 text-center">
  <span class="px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-[10px] font-extrabold uppercase tracking-wider">
    VendorCenter Portal
  </span>
  <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight mt-2">Partner Sign In</h2>
  <p class="text-xs text-slate-500 mt-1">Manage orders, catalog, and bank settlements</p>
</div>

<form action="{{ url_for('auth.login', next=url_for('seller.dashboard')) }}" method="POST" class="space-y-4">
  <div>
    <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Registered Partner Email</label>
    <input type="email" id="email" name="email" value="seller@techzone.in" required
           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
  </div>

  <div>
    <div class="flex items-center justify-between mb-1.5">
      <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
      <a href="{{ url_for('seller.forgot_password') }}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Forgot?</a>
    </div>
    <input type="password" id="password" name="password" value="seller123" required
           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
  </div>

  <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 transition-all mt-2">
    Sign In to VendorCenter
  </button>
</form>

<p class="text-center text-xs text-slate-500 mt-6">
  Want to sell on Nova Mart? 
  <a href="{{ url_for('seller.register') }}" class="font-bold text-emerald-600 hover:underline">Apply for Vendor Account</a>
</p>
{% endblock %}
