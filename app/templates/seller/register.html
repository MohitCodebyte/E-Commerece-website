{% extends 'base_auth.html' %}

{% block title %}Apply to Sell | VendorCenter{% endblock %}

{% block content %}
<div class="mb-6 text-center">
  <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-extrabold uppercase tracking-wider">
    Vendor Onboarding
  </span>
  <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight mt-2">Become a Seller</h2>
  <p class="text-xs text-slate-500 mt-1">Start selling your products across India with 0% listing fee</p>
</div>

<form action="{{ url_for('seller.register') }}" method="POST" class="space-y-4 text-xs font-semibold">
  <div>
    <label class="block text-slate-700 uppercase mb-1">Store / Business Brand Name</label>
    <input type="text" name="store_name" placeholder="Apex Audio Tech" required
           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
  </div>

  <div>
    <label class="block text-slate-700 uppercase mb-1">Business Email Address</label>
    <input type="email" name="email" placeholder="contact@brand.in" required
           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
  </div>

  <div>
    <label class="block text-slate-700 uppercase mb-1">Contact Phone</label>
    <input type="tel" name="phone" placeholder="+91 98200 99999" required
           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-slate-700 uppercase mb-1">GSTIN Number</label>
      <input type="text" name="gstin" placeholder="27AABCU9603R1ZM" required
             class="w-full px-3 py-2 bg-slate-50 border rounded-xl font-mono uppercase">
    </div>
    <div>
      <label class="block text-slate-700 uppercase mb-1">Company PAN</label>
      <input type="text" name="pan" placeholder="AABCU9603R" required
             class="w-full px-3 py-2 bg-slate-50 border rounded-xl font-mono uppercase">
    </div>
  </div>

  <div>
    <label class="block text-slate-700 uppercase mb-1">Create Password</label>
    <input type="password" name="password" required minlength="6" placeholder="••••••••"
           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
  </div>

  <div class="pt-1">
    <label class="flex items-start gap-2 cursor-pointer">
      <input type="checkbox" required class="w-4 h-4 mt-0.5 rounded text-indigo-600">
      <span class="text-[11px] text-slate-600">I agree to Nova Mart Merchant Agreement & Commission Schedule (10%).</span>
    </label>
  </div>

  <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md transition-all mt-2">
    Submit Merchant Application
  </button>
</form>

<p class="text-center text-xs text-slate-500 mt-6">
  Already have a vendor account? 
  <a href="{{ url_for('seller.login') }}" class="font-bold text-indigo-600 hover:underline">Sign In</a>
</p>
{% endblock %}
