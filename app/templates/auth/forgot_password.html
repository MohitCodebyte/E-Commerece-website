{% extends 'base_auth.html' %}

{% block title %}Forgot Password | NOVA MART{% endblock %}

{% block content %}
<div class="mb-6 text-center">
  <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3">
    <span class="material-symbols-outlined text-2xl">lock_reset</span>
  </div>
  <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Forgot Password</h2>
  <p class="text-xs text-slate-500 mt-1">Enter your email and we'll send recovery instructions</p>
</div>

<form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-4">
  <div>
    <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Registered Email</label>
    <div class="relative">
      <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
        <span class="material-symbols-outlined text-lg">mail</span>
      </div>
      <input type="email" id="email" name="email" required
             class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600 transition-all"
             placeholder="you@example.com">
    </div>
  </div>

  <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md shadow-indigo-500/20 transition-all mt-2">
    Send Recovery Link
  </button>
</form>

<div class="text-center mt-6">
  <a href="{{ url_for('auth.login') }}" class="text-xs font-bold text-slate-600 hover:text-indigo-600 flex items-center justify-center gap-1">
    <span class="material-symbols-outlined text-sm">arrow_back</span>
    Return to Sign In
  </a>
</div>
{% endblock %}
